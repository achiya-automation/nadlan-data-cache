name: refresh-nadlan-data
on:
  schedule:
    - cron: '30 3 * * 0'   # ראשון 03:30 UTC = 06:30 ישראל
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch all settlements
        run: python fetch_all.py
      - name: Commit summary
        run: |
          git config user.name "nadlan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add summary.json
          git diff --cached --quiet || git commit -m "update: רענון נתוני nadlan שבועי"
          git push
